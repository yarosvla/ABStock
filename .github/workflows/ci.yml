name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ABStock.slnx

      - name: Build
        run: dotnet build ABStock.slnx --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: >-
          dotnet test ABStock.slnx
          --configuration Release
          --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_attempt }}
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build and smoke-test container
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: abstock:ci

      - name: Smoke-test container
        shell: bash
        run: |
          docker run --detach --name abstock-ci \
            --publish 127.0.0.1:5062:8080 \
            --env "ConnectionStrings__ABStock=Data Source=/app/data/abstock.db" \
            abstock:ci

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5062/; then
              exit 0
            fi
            sleep 2
          done

          docker logs abstock-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force abstock-ci || true
